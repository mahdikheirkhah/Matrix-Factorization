name: Recommender CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

# This environment variable tells GitHub to use Node 24 for the underlying runner
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
          plugins: poetry-plugin-export

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Check Code Formatting (Black)
        run: poetry run black . --check

      - name: Verify Audit Requirements (Imports)
        run: |
          poetry run python -c "import numpy; import pandas; import scipy; import streamlit; import matplotlib; print('✅ Audit Imports Passed')"
      
      - name: Security Check
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          pip install safety
          poetry export -f requirements.txt --output temp_req.txt --without-hashes
          # Use the API key and the --non-interactive flag (if available in your version)
          safety scan --key $SAFETY_API_KEY -r temp_req.txt
      
      - name: Run Tests with Coverage
        run: |
          poetry run python -m pytest --cov=utils --cov-report=xml tests/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: mahdikheirkhah/Matrix-Factorization
          verbose: true